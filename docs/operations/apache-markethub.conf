# Include this file from the local Apache configuration, then httpd -t and restart.
# Alias takes precedence over htdocs physical path; no root-level PHP workaround.
Alias /market-stall "C:/xampp/htdocs/market-stall/public"
<Directory "C:/xampp/htdocs/market-stall">
    AllowOverride None
    Require all denied
</Directory>
<Directory "C:/xampp/htdocs/market-stall/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require local
    DirectoryIndex index.php
</Directory>
